spring:
  application:
    name: api-connector
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:h2:file:./data/integration;AUTO_SERVER=TRUE;MODE=MySQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql

server:
  port: 19090

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
    doc-expansion: list
    display-request-duration: true
  show-actuator: false

integration:
  security:
    enabled: false
    api-key-header: X-Integration-Api-Key
    runtime-api-keys: []
    admin-api-keys: []
  invoke:
    platform-http-status: PLATFORM_OK
    audit-enabled: true
    rate-limit-per-code3rd-per-minute: 0
  legacy:
    enabled: true
  persistence:
    # classpath | memory | jdbc | composite（classpath 示例 + jdbc 已发布，推荐）
    source: composite
    sync-on-startup: true
    sync-interval-ms: 0

logging:
  level:
    com.suntek.apiconnector: INFO
